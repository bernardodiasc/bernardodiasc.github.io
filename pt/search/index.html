u. O que eu não esperava era que, três meses depois, eu estaria abordando problemas desconhecidos com um formato mental diferente do que tinha antes. As ferramentas mudaram o trabalho, e o trabalho mudado mudou como eu penso sobre trabalho. Esse segundo loop é o mais interessante.","tags":["ai","strategy","learning","cognition","mental-models","systems-thinking","philosophy","workflow","ai-assisted"],"draft":true,"categoryId":"ai-work","categoryTitle":"AI and knowledge work","categoryIcon":"robot","series":"ai-philosophy"},{"url":"/pt/2026/05/09/what-i-havent-learned-yet","title":"O que eu ainda não aprendi","date":"2026-05-09T00:00:00.000Z","dateFormatted":"8 de maio de 2026","excerpt":"Depois de escrever um monte de posts que soam confiantes sobre ferramental de IA, aqui vai o inventário do que eu ainda estou confuso. Servidores MCP que quase não usei. Padrões de LangGraph que copiei sem entender totalmente. Sutilezas de prompt engineering que eu continuo errando. Se você sabe alguma dessas coisas melhor que eu, quero aprender com você.","tags":["ai","learning","developer-experience","community","mcp","langgraph","prompt-engineering","openai","anthropic","python","human-written"],"draft":true,"categoryId":"ai-work","categoryTitle":"AI and knowledge work","categoryIcon":"robot","series":"ai-philosophy"},{"url":"/pt/2026/05/08/the-compound-effect-of-ai-tooling","title":"O efeito composto do ferramental de IA","date":"2026-05-08T00:00:00.000Z","dateFormatted":"7 de maio de 2026","excerpt":"Cada peça — rules, skills, subagents, journaling — é pequena por si só. O interessante é o que acontece quando elas se empilham. O sistema deixa de parecer uma coleção de ferramentas e começa a parecer um ambiente que foi moldado pra mim. Essa mudança é o efeito composto, e é a parte que ninguém fala.","tags":["ai","ai-agents","strategy","developer-experience","systems-thinking","compounding","architecture","workflow","ai-assisted"],"draft":true,"categoryId":"ai-work","categoryTitle":"AI and knowledge work","categoryIcon":"robot","series":"ai-philosophy"},{"url":"/pt/2026/05/07/from-daily-notes-to-stakeholder-reports","title":"De anotações diárias a relatórios para stakeholders","date":"2026-05-07T00:00:00.000Z","dateFormatted":"6 de maio de 2026","excerpt":"Uma semana de entradas no diário serve quatro audiências, com quatro lentes diferentes. O gestor quer resultados e riscos. O time quer saber o que está em andamento. O revisor quer os casos de borda. Você quer padrões. Aqui vai por que uma fonte mais quatro lentes funciona melhor que quatro trackers separados.","tags":["productivity","workflow","communication","leadership","reporting","markdown","slack","remote-work","learning","ai-assisted"],"draft":true,"categoryId":"strategy","categoryTitle":"Strategy & Entrepreneurship","categoryIcon":"binoculars","series":"engineering-journal"},{"url":"/pt/2026/05/06/vendor-agnostic-ai-tooling-portable-skills-across-coding-agents","title":"Ferramentas de IA vendor-agnostic — skills portáveis entre coding agents","date":"2026-05-06T00:00:00.000Z","dateFormatted":"5 de maio de 2026","excerpt":"Uma pasta canônica de origem. Symlinks de cada diretório esperado por cada ferramenta apontando de volta para essa origem. Os mesmos arquivos de skill funcionam no Cursor, Claude Code e qualquer outro coding agent de IA sem forks. Aqui está o layout, a lógica de sincronização, e por que prender sua biblioteca de skills em uma ferramenta é um erro que vale a pena evitar.","tags":["ai","ai-agents","vibecoding","architecture","developer-experience","cursor","claude","vscode","bash","symlinks","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-workflows"},{"url":"/pt/2026/05/05/ai-powered-engineering-workflows","title":"Workflows de engenharia assistidos por IA","date":"2026-05-05T00:00:00.000Z","dateFormatted":"4 de maio de 2026","excerpt":"Um assistente de IA não substitui o ciclo diário de captura/planejamento/relatório que a maioria dos engenheiros roda. Ele muda a fricção. O trabalho que antes levava uma hora no fim do dia leva cinco minutos. O que a IA faz bem, e o que ainda precisa de julgamento humano, são coisas diferentes de formas que vale a pena nomear explicitamente.","tags":["ai","ai-agents","productivity","workflow","automation","llm","prompt-engineering","openai","anthropic","cursor","ai-assisted"],"draft":true,"categoryId":"ai-work","categoryTitle":"AI and knowledge work","categoryIcon":"robot","series":"ai-workflows"},{"url":"/pt/2026/05/04/wiring-a-journal-agent-with-slack","title":"Conectando um agente de diário ao Slack","date":"2026-05-04T00:00:00.000Z","dateFormatted":"3 de maio de 2026","excerpt":"Um agente de diário que lê dos canais Slack da sua equipe para ter contexto e posta atualizações formatadas de volta é um wrapper Python pequeno mais alguns bot tokens bem nomeados. Esta é a integração real — setup de tokens, conversations.history, recibos de postagem, aliases de canais, e as pequenas escolhas que mantêm tudo seguro de rodar.","tags":["ai","ai-agents","vibecoding","slack","slack-api","bot-tokens","integrations","python","rest-api","bash","ai-assisted"],"draft":true,"categoryId":"integrations","categoryTitle":"Third-party integrations","categoryIcon":"extension","series":"engineering-journal"},{"url":"/pt/2026/05/03/why-every-engineer-should-keep-a-journal","title":"Por que todo engenheiro deveria manter um diário","date":"2026-05-03T00:00:00.000Z","dateFormatted":"2 de maio de 2026","excerpt":"A maioria dos engenheiros não mantém um diário. Os que eu mais respeito, mantêm. Alguns no papel, alguns em texto puro, alguns dentro de um sistema assistido por IA. Ferramentas diferentes, os mesmos benefícios cumulativos — memória, responsabilidade, autoconhecimento, comunicação. Aqui vai o argumento, independente de como você faz.","tags":["productivity","workflow","communication","learning","journaling","remote-work","self-improvement","leadership","markdown","ai-assisted"],"draft":true,"categoryId":"strategy","categoryTitle":"Strategy & Entrepreneurship","categoryIcon":"binoculars","series":"engineering-journal"},{"url":"/pt/2026/05/02/when-your-ai-writes-200-lines-and-it-could-be-50","title":"Quando sua IA escreve 200 linhas e poderia ser 50","date":"2026-05-02T00:00:00.000Z","dateFormatted":"1 de maio de 2026","excerpt":"O modo de falha mais comum que vejo com código gerado por IA é overengineering. Não código ruim — apenas código demais. Este post é um tour pelos formatos específicos que o overengineering assume, diffs antes/depois de sessões reais, e o check mental de uma linha que resolve a maior parte disso.","tags":["ai","ai-agents","vibecoding","best-practices","code-review","code-quality","refactoring","karpathy","python","typescript","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-guardrails"},{"url":"/pt/2026/05/01/behavioral-guardrails-for-ai-coding-assistants","title":"Guardrails comportamentais para assistentes de IA de programação","date":"2026-05-01T00:00:00.000Z","dateFormatted":"30 de abril de 2026","excerpt":"Existem quatro comportamentos que quero que qualquer agente de IA de programação siga, independente do modelo por trás. Pense antes de codificar. Mantenha simples. Faça mudanças cirúrgicas. Defina o que significa estar pronto. Cada um veio de um erro real que eu vi o agente cometer. Aqui vai por que os codifiquei como um arquivo de rule.","tags":["ai","ai-agents","vibecoding","developer-experience","best-practices","karpathy","prompt-engineering","code-quality","cursor","claude","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-guardrails"},{"url":"/pt/2026/04/30/org-wide-standards-as-code","title":"Standards organizacionais como código","date":"2026-04-30T00:00:00.000Z","dateFormatted":"29 de abril de 2026","excerpt":"Um repositório de standards, um wrapper que transforma esses standards em rules, skills e um subagent de revisão de segurança para o agente de IA. Adicione o wrapper como pasta de workspace ao lado de qualquer projeto e o agente segue as políticas automaticamente. Aqui vai o padrão, a estrutura de pastas, e por que isso é melhor do que cópias por projeto.","tags":["ai","ai-agents","security","architecture","developer-experience","git","git-submodules","markdown","cursor","claude","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"subagents"},{"url":"/pt/2026/04/29/a-read-only-ai-security-reviewer","title":"Um revisor de segurança de IA read-only","date":"2026-04-29T00:00:00.000Z","dateFormatted":"28 de abril de 2026","excerpt":"Um subagent que lê suas regras de segurança, olha o código que você acabou de escrever, e te diz o que tá errado por severidade — com citações. Aqui vai o arquivo de definição real, o conjunto de regras que ele consulta, a saída que produz, e as pequenas escolhas que tornam ele útil em vez de um gerador de ruído.","tags":["ai","ai-agents","vibecoding","security","code-review","yaml","markdown","owasp","cursor","claude","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"subagents"},{"url":"/pt/2026/04/28/subagents-specialized-ai-that-doesnt-pollute-your-context","title":"Subagents — IA especializada que não polui seu contexto","date":"2026-04-28T00:00:00.000Z","dateFormatted":"27 de abril de 2026","excerpt":"Pedir pro seu agente de IA principal fazer uma tarefa pesada de análise queima contexto que você nunca vai recuperar. Subagents são como você spawna uma instância de IA fresca, com escopo definido e às vezes read-only pra fazer esse trabalho — e devolver só a resposta, não o ruído. Aqui vai o modelo, e quando usar.","tags":["ai","ai-agents","vibecoding","architecture","context-management","design-patterns","cursor","claude","markdown","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"subagents"},{"url":"/pt/2026/04/27/building-debug-skills-that-inspect-live-systems","title":"Criando debug skills que inspecionam sistemas em produção","date":"2026-04-27T00:00:00.000Z","dateFormatted":"26 de abril de 2026","excerpt":"Uma debug skill transforma \"deixa eu abrir o banco e ver o que o agente achou que tava fazendo\" numa pergunta de trinta segundos pro seu agente de IA. Aqui vai um walkthrough de uma — do início ao fim — com o layout real que uso, as pegadinhas, e as decisões pequenas que definem se a skill é genuinamente útil ou só ruído visível.","tags":["ai","ai-agents","vibecoding","debugging","python","postgresql","opentelemetry","bash","langgraph","cursor","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-rules-and-skills"},{"url":"/pt/2026/04/26/a-taxonomy-of-ai-agent-skills","title":"Uma taxonomia de AI agent skills","date":"2026-04-26T00:00:00.000Z","dateFormatted":"25 de abril de 2026","excerpt":"Depois de escrever trinta e três skills, uma estrutura emergiu. Seis tipos. Uma convenção de nomes que o próprio agente usa para encontrar a certa. Esta é a taxonomia em que cheguei, por que cada tipo existe, e as pequenas decisões de design que tornaram a gaveta inteira mais fácil de navegar.","tags":["ai","ai-agents","vibecoding","architecture","naming-conventions","design-patterns","python","markdown","bash","cursor","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-rules-and-skills"},{"url":"/pt/2026/04/25/ai-agent-skills-why-i-wrote-33-of-them","title":"AI agent skills — por que escrevi 33","date":"2026-04-25T00:00:00.000Z","dateFormatted":"24 de abril de 2026","excerpt":"Comecei com uma. Um pequeno arquivo Markdown com alguns comandos shell dentro, que o agente podia acessar pelo nome. Dois meses depois eram trinta e três. Aqui vai a história de como a gaveta de skills foi enchendo, e por que continuou se pagando.","tags":["ai","ai-agents","vibecoding","developer-experience","markdown","yaml","python","automation","postgresql","bash","cursor","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-rules-and-skills"},{"url":"/pt/2026/04/24/rules-as-project-memory","title":"Rules como memória do projeto","date":"2026-04-24T00:00:00.000Z","dateFormatted":"23 de abril de 2026","excerpt":"Agentes de código com IA começam cada conversa sem memória nenhuma. Rules são os pequenos arquivos Markdown que resolvem isso — dizem ao agente as convenções do seu projeto, anexados aos arquivos certos na hora certa. Aqui vai como funcionam e como eu penso na hora de escrevê-las.","tags":["ai","ai-agents","vibecoding","developer-experience","yaml","glob","configuration","markdown","cursor","claude","ai-assisted"],"draft":true,"categoryId":"developer-tooling","categoryTitle":"Developer tooling","categoryIcon":"build","series":"ai-rules-and-skills"},{"url":"/pt/2026/04/23/authorship-tags-being-honest-about-who-wrote-what","title":"Tags de autoria — sendo honesto sobre quem escreveu o quê","date":"2026-04-23T00:00:00.000Z","dateFormatted":"22 de abril de 2026","excerpt":"Adicionei tags de autoria a cada post deste blog — human-written, ai-assisted ou ai-generated. A categorização em si foi mais difícil que a implementação. Aqui vai o que eu acho que os rótulos realmente significam, e por que declará-los parece menos opcional do que costumava ser.","tags":["ai","ai-agents","ethics","transparency","developer-experience","content-strategy","astro","ai-assisted"],"draft":true,"categoryId":"this-blog","categoryTitle":"This blog development process","categoryIcon":"developer-board","serie   var showDrafts = document.documentElement.classList.contains('show-drafts');
  var visibleItems = showDrafts ? items : items.filter(function (i) { return !i.draft; });

  (function updateCounts() {
    document.querySelectorAll('.category-card').forEach(function (card) {
      var catId = card.getAttribute('data-category');
      var count = visibleItems.filter(function (i) { return i.categoryId === catId; }).length;
      var countEl = card.querySelector('.category-card__count');
      if (countEl) countEl.textContent = count + ' posts';
      if (count === 0) card.style.display = 'none';
    });
    document.querySelectorAll('.series-chip').forEach(function (chip) {
      var seriesId = chip.getAttribute('data-series');
      var count = visibleItems.filter(function (i) { return i.series === seriesId; }).length;
      var countEl = chip.querySelector('.series-chip__count');
      if (countEl) countEl.textContent = '(' + count + ')';
      if (count === 0) chip.style.display = 'none';
    });
    var visibleTags = {};
    visibleItems.forEach(function (i) {
      i.tags.forEach(function (t) { visibleTags[t] = true; });
    });
    document.querySelectorAll('.tag-chip').forEach(function (chip) {
      var tag = chip.getAttribute('data-tag');
      if (!visibleTags[tag]) chip.style.display = 'none';
    });
  })();

  const searchInput = document.getElementById('search-input');
  const resultsSection = document.getElementById('results-section');
  const resultsList = document.getElementById('results-list');
  const resultsTitle = document.getElementById('results-title');
  const noResults = document.getElementById('no-results');
  const clearButton = document.getElementById('clear-filters');
  const categoryCards = document.querySelectorAll('.category-card');
  const tagChips = document.querySelectorAll('.tag-chip');
  const seriesChips = document.querySelectorAll('.series-chip');

  var categoriesPanel = document.getElementById('categories-panel');
  var tagsPanel = document.getElementById('tags-panel');
  var categoriesSelection = document.getElementById('categories-selection');
  var tagsSelection = document.getElementById('tags-selection');
  var seriesSelection = document.getElementById('series-selection');

  let activeCategory = null;
  let activeTag = null;
  let activeSeries = null;

  function updateSelectionBadges() {
    if (activeCategory) {
      var card = document.querySelector('.category-card[data-category="' + activeCategory + '"]');
      var title = card ? card.getAttribute('data-title') : activeCategory;
      categoriesSelection.innerHTML = '<span class="selection-badge">' + title + '</span>';
    } else {
      categoriesSelection.innerHTML = '';
    }

    if (activeTag) {
      tagsSelection.innerHTML = '<span class="selection-badge">' + activeTag + '</span>';
    } else {
      tagsSelection.innerHTML = '';
    }

    if (seriesSelection) {
      if (activeSeries) {
        var chip = document.querySelector('.series-chip[data-series="' + activeSeries + '"]');
        var sTitle = chip ? chip.getAttribute('data-title') : activeSeries;
        seriesSelection.innerHTML = '<span class="selection-badge">' + sTitle + '</span>';
      } else {
        seriesSelection.innerHTML = '';
      }
    }
  }

  function renderResults(filtered, label) {
    resultsSection.style.display = '';
    resultsTitle.textContent = label;

    if (filtered.length === 0) {
      resultsList.innerHTML = '';
      noResults.style.display = '';
      return;
    }

    noResults.style.display = 'none';
    var draftSuffix = showDrafts && window.location.hostname !== 'localhost' ? '?draft' : '';
    resultsList.innerHTML = filtered.map(function (item) {
      return '<a href="' + item.url + draftSuffix + '" class="result-item">' +
        '<h3 class="result-item__title">' +
          (item.categoryIcon
            ? '<span class="result-item__icon"><svg viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet"><use href="#icon-' + item.categoryIcon + '" /></svg></span>'
            : '') +
          item.title +
        '</h3>' +
        '<span class="result-item__meta">' + item.dateFormatted +
          (item.categoryTitle ? ' · ' + item.categoryTitle : '') +
        '</span>' +
        (item.excerpt ? '<p class="result-item__excerpt">' + item.excerpt + '</p>' : '') +
      '</a>';
    }).join('');
  }

  function clearAll() {
    activeCategory = null;
    activeTag = null;
    activeSeries = null;
    searchInput.value = '';
    resultsSection.style.display = 'none';
    categoryCards.forEach(function (c) { c.classList.remove('category-card--active'); });
    tagChips.forEach(function (t) { t.classList.remove('tag-chip--active'); });
    seriesChips.forEach(function (s) { s.classList.remove('series-chip--active'); });
    updateSelectionBadges();
  }

  function applyFilters() {
    var query = searchInput.value.trim().toLowerCase();
    var hasFilter = query || activeCategory || activeTag || activeSeries;

    if (!hasFilter) {
      resultsSection.style.display = 'none';
      return;
    }

    var filtered = visibleItems;
    var labels = [];

    if (activeCategory) {
      filtered = filtered.filter(function (item) {
        return item.categoryId === activeCategory;
      });
      var cat = visibleItems.find(function (i) { return i.categoryId === activeCategory; });
      labels.push(cat ? cat.categoryTitle : activeCategory);
    }

    if (activeSeries) {
      filtered = filtered.filter(function (item) {
        return item.series === activeSeries;
      });
      var sChip = document.querySelector('.series-chip[data-series="' + activeSeries + '"]');
      labels.push(sChip ? sChip.getAttribute('data-title') : activeSeries);
    }

    if (activeTag) {
      filtered = filtered.filter(function (item) {
        return item.tags.indexOf(activeTag) !== -1;
      });
      labels.push('#' + activeTag);
    }

    if (query) {
      filtered = filtered.filter(function (item) {
        return item.title.toLowerCase().indexOf(query) !== -1 ||
               item.excerpt.toLowerCase().indexOf(query) !== -1 ||
               item.tags.some(function (t) { return t.toLowerCase().indexOf(query) !== -1; }) ||
               item.categoryTitle.toLowerCase().indexOf(query) !== -1;
      });
      labels.push('"' + searchInput.value.trim() + '"');
    }

    var label = filtered.length + ' resultado' + (filtered.length !== 1 ? 's' : '');
    if (labels.length) label += ' para ' + labels.join(' + ');

    renderResults(filtered, label);
  }

  searchInput.addEventListener('input', applyFilters);

  categoryCards.forEach(function (card) {
    card.addEventListener('click', function () {
      var id = card.getAttribute('data-category');
      if (activeCategory === id) {
        activeCategory = null;
        card.classList.remove('category-card--active');
      } else {
        activeCategory = id;
        categoryCards.forEach(function (c) { c.classList.remove('category-card--active'); });
        card.classList.add('category-card--active');
      }
      updateSelectionBadges();
      applyFilters();
    });
  });

  tagChips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var tag = chip.getAttribute('data-tag');
      if (activeTag === tag) {
        activeTag = null;
        chip.classList.remove('tag-chip--active');
      } else {
        activeTag = tag;
        tagChips.forEach(function (t) { t.classList.remove('tag-chip--active'); });
        chip.classList.add('tag-chip--active');
      }
      updateSelectionBadges();
      applyFilters();
    });
  });

  seriesChips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var id = chip.getAttribute('data-series');
      if (activeSeries === id) {
        activeSeries = null;
        chip.classList.remove('series-chip--active');
      } else {
        activeSeries = id;
        seriesChips.forEach(function (s) { s.classList.remove('series-chip--active'); });
        chip.classList.add('series-chip--active');
      }
      updateSelectionBadges();
      applyFilters();
    });
  });

  clearButton.addEventListener('click', clearAll);
})();</script>
